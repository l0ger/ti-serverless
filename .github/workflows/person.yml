name: Person

on:
  push:
    branches: ['**']
    paths:
      - services/person/**
      - shared/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .nvmrc
      - .github/workflows/person.yml
      - .github/workflows/_deploy.yml

permissions:
  id-token: write
  contents: read

jobs:
  test:
    if: github.ref != 'refs/heads/master'
    uses: ./.github/workflows/_deploy.yml
    with:
      working-directory: services/person
      stack: Person-test
      stage: test
      environment: person-test

  prod:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_deploy.yml
    with:
      working-directory: services/person
      stack: Person-prod
      stage: prod
      environment: person-prod
