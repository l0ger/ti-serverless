name: Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: CDK app folder(cdk.json)
        type: string
        required: true
      stack:
        description: Stack to deploy (never the GithubOidc-* stack)
        type: string
        required: true
      stage:
        description: CDK stage context (test | prod)
        type: string
        required: true
      environment:
        description: GitHub environment; also names the deploy role (github-deploy-<environment>)
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Load stage env file
        run: grep -Ev '^\s*(#|$)' "${{ inputs.working-directory }}/env/${{ inputs.stage }}.env" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-deploy-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk deploy
        working-directory: ${{ inputs.working-directory }}
        run: npx cdk deploy ${{ inputs.stack }} -c stage=${{ inputs.stage }} --require-approval never
